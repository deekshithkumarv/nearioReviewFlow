<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neario Setup</title>
<meta name="description" content="Set up your business on Neario ReviewFlow.">
<meta name="robots" content="noindex">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: centred wizard, progress rail on top, one step per screen. Final step shows a real, scannable QR for the feedback link plus print-size options. */
:root{
  --bg:#f7f3ea;--surface:#fffdf8;--surface-2:#f1ece0;--line:#e6dfcf;--fg:#17261d;--muted:#65726a;
  --primary:#1f5a36;--on-primary:#fff;--accent-text:#1f5a36;--sage:#dfe9d3;--sage-ink:#2c5a3b;--green:#2f9150;--green-soft:#dcefd9;--red:#c8442f;--red-soft:#f9e0da;--blue:#2f6bdc;
  --shadow:0 1px 2px rgba(35,50,30,.06),0 12px 32px rgba(35,50,30,.08);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1612;--surface:#17201a;--surface-2:#1e2a22;--line:#2a372e;--fg:#eaf0e6;--muted:#9aa99f;
  --primary:#3f9a60;--accent-text:#8fd0a0;--sage:#223a2a;--sage-ink:#bfe3c8;--green:#52b574;--green-soft:#1d3524;--red:#ee7a66;--red-soft:#3d2018;--blue:#6e9bf0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1612;--surface:#17201a;--surface-2:#1e2a22;--line:#2a372e;--fg:#eaf0e6;--muted:#9aa99f;
  --primary:#3f9a60;--accent-text:#8fd0a0;--sage:#223a2a;--sage-ink:#bfe3c8;--green:#52b574;--green-soft:#1d3524;--red:#ee7a66;--red-soft:#3d2018;--blue:#6e9bf0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:36px;height:36px;border-radius:11px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:800;font-size:18px}
.wm b{display:block;font-size:23px;letter-spacing:-.06em;line-height:1;color:var(--accent-text)}.wm small{font-size:9px;letter-spacing:.32em;font-weight:700;color:var(--muted)}
.demo{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:8px 12px}
.rail{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rail div{display:flex;flex-direction:column;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted)}
.rail i{height:5px;border-radius:9px;background:var(--line)}
.rail .on{color:var(--fg)}.rail .on i{background:var(--primary)}
.rail span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:clamp(20px,4vw,32px);display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:clamp(24px,4vw,30px);letter-spacing:-.04em;line-height:1.1;text-wrap:balance}
.mut{color:var(--muted);margin:0}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:400}
input[aria-invalid="true"]{border-color:var(--red)}
.err{color:var(--red);font-size:13px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.btn{border:0;border-radius:14px;padding:13px 22px;font-weight:700;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.p{background:var(--primary);color:var(--on-primary)}.btn.s{background:var(--surface);border:1.5px solid var(--line);color:var(--fg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:600;min-height:40px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center}
.li input{flex:1}
.x{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;width:44px;height:44px;font-size:18px;cursor:pointer;flex:none}
.add{align-self:flex-start;background:none;border:0;color:var(--accent-text);font-weight:700;padding:6px 0;cursor:pointer}
.gcard{border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:flex-start}
.gcard .g{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:20px;border:1px solid var(--line);flex:none}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.note{background:var(--sage);color:var(--sage-ink);border-radius:14px;padding:12px 14px;font-size:14px}
.qrbox{display:flex;gap:22px;flex-wrap:wrap;align-items:center;justify-content:center}
.qrbox canvas{background:#fff;border-radius:16px;padding:14px;border:1px solid var(--line);width:200px;height:200px;image-rendering:pixelated}
.url{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--surface-2);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere}
.sum{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}.sum dt{color:var(--muted)}.sum dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pc{position:relative;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:22px 16px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.pc.on{border-color:var(--primary);box-shadow:var(--shadow)}.pc b{font-size:17px}.pc .amt{font-size:30px;font-weight:800;letter-spacing:-.04em}
.pc .ribbon{position:absolute;top:-12px;left:14px;background:#f6c344;color:#2a1d00;font-weight:800;font-size:11.5px;text-transform:uppercase;border-radius:99px;padding:4px 12px}
@media (max-width:480px){.plans{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;width:min(420px,calc(100% - 32px));text-align:center}
[hidden]{display:none!important}
@media (max-width:480px){.rail span{display:none}.nav .btn{flex:1}}
</style>

<div class="wrap">
  <div class="brand"><span class="mark" aria-hidden="true">N</span><span class="wm"><b>neario</b><small>REVIEWFLOW</small></span></div>
  <div class="demo" role="note">Prototype: nothing is saved. The QR code is real and scannable, but the link is a placeholder address.</div>
  <div class="rail" id="rail" aria-label="Setup progress"></div>
  <section class="card" id="card" aria-live="polite"></section>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var STEPS=['Business','Services','Locations','Google','Plan','QR code'];
var D={biz:'',cat:'Salon or spa',owner:'',email:'',svc:['Haircut','Facial','Hair Spa'],locs:[{n:'',a:''}],g:false,placeId:'',size:'A5',plan:'yearly'};
var SUGG={'Salon or spa':['Haircut','Facial','Hair Spa','Manicure','Waxing','Bridal'],'Restaurant or café':['Dine-in','Takeaway','Delivery','Catering'],'Clinic':['Consultation','Check-up','Lab test','Follow-up'],'Retail':['In-store','Online order','Returns'],'Other':['Service','Product','Support']};
var step=0,errs={};
function toast(m){var e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},3200)}
function slug(s){return (s||'your-business').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'your-business'}
function rail(){$('#rail').innerHTML=STEPS.map(function(s,i){return '<div class="'+(i<=step?'on':'')+'"><i></i><span>'+(i+1)+'. '+s+'</span></div>'}).join('')}
function field(id,label,val,type,extra){return '<label class="f" for="'+id+'">'+label+'<input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val)+'" '+(extra||'')+(errs[id]?' aria-invalid="true" aria-describedby="e-'+id+'"':'')+'>'+(errs[id]?'<span class="err" id="e-'+id+'">'+errs[id]+'</span>':'')+'</label>'}
function nav(back,next,nl){return '<div class="nav">'+(back?'<button class="btn s" data-back>Back</button>':'<span></span>')+'<button class="btn p" data-next>'+(nl||'Continue')+'</button></div>'}
function render(){
  rail();var c=$('#card'),h='';
  if(step===0){
    h='<h1>Tell us about your business</h1><p class="mut">This sets up your workspace and your customer feedback page.</p>'+
    field('biz','Business name',D.biz,'text','autocomplete="organization"')+
    '<label class="f" for="cat">Type of business<select id="cat">'+Object.keys(SUGG).map(function(k){return '<option'+(k===D.cat?' selected':'')+'>'+k+'</option>'}).join('')+'</select></label>'+
    '<div class="row">'+field('owner','Your name',D.owner,'text','autocomplete="name"')+field('email','Email',D.email,'email','autocomplete="email"')+'</div>'+nav(false);
  }else if(step===1){
    h='<h1>What do you offer?</h1><p class="mut">Customers pick one of these when they leave feedback. You can change them later.</p>'+
    '<div class="chips" role="group" aria-label="Suggested services">'+SUGG[D.cat].map(function(s){return '<button class="chip" data-svc="'+esc(s)+'" aria-pressed="'+(D.svc.indexOf(s)>-1)+'">'+esc(s)+'</button>'}).join('')+'</div>'+
    '<div class="list" id="custom">'+D.svc.filter(function(s){return SUGG[D.cat].indexOf(s)<0}).map(function(s,i){return '<div class="li"><input type="text" value="'+esc(s)+'" data-cs="'+esc(s)+'" aria-label="Custom service"><button class="x" data-rm="'+esc(s)+'" aria-label="Remove '+esc(s)+'">×</button></div>'}).join('')+'</div>'+
    '<div class="li"><input type="text" id="newsvc" placeholder="Add another service" aria-label="Add another service"><button class="btn s" data-addsvc>Add</button></div>'+
    (errs.svc?'<span class="err">'+errs.svc+'</span>':'')+nav(true);
  }else if(step===2){
    h='<h1>Where do customers visit you?</h1><p class="mut">Each location gets its own feedback link and QR code.</p><div class="list">'+
    D.locs.map(function(l,i){return '<div class="row" style="align-items:flex-end"><label class="f" for="ln'+i+'">Location name<input id="ln'+i+'" type="text" data-ln="'+i+'" value="'+esc(l.n)+'" placeholder="Indiranagar"'+(errs['ln'+i]?' aria-invalid="true"':'')+'></label><label class="f" for="la'+i+'">Area or city<input id="la'+i+'" type="text" data-la="'+i+'" value="'+esc(l.a)+'" placeholder="Bengaluru"></label>'+(D.locs.length>1?'<button class="x" data-rml="'+i+'" aria-label="Remove location">×</button>':'')+'</div>'+(errs['ln'+i]?'<span class="err">'+errs['ln'+i]+'</span>':'')}).join('')+'</div>'+
    '<button class="add" data-addloc>+ Add another location</button>'+nav(true);
  }else if(step===3){
    h='<h1>Connect your Google Business Profile</h1><p class="mut">This lets Neario show your Google reviews and help you reply. It also gives customers your correct review link.</p>'+
    '<div class="gcard"><div class="g" aria-hidden="true">G</div><div style="flex:1;min-width:0"><b>Google Business Profile</b><br><span class="pill'+(D.g?' ok':'')+'">'+(D.g?'Connected (example)':'Not connected')+'</span></div><button class="btn '+(D.g?'s':'p')+'" data-g>'+(D.g?'Disconnect':'Connect')+'</button></div>'+
    '<label class="f" for="pid">Google Place ID (for your review link)<input id="pid" type="text" value="'+esc(D.placeId)+'" placeholder="ChIJ…"></label>'+
    '<div class="note">Every customer will see the same Google review link after sending feedback, whatever their rating. Neario does not filter who gets it.</div>'+
    '<p class="mut" style="font-size:13px">You can skip this and connect later. Your feedback page works without it, but the Google review step stays hidden until a Place ID is added.</p>'+nav(true,true,'Continue');
  }else if(step===4){
    h='<h1>Choose how to pay</h1><p class="mut">Everything is included either way. You can change this later.</p>'+
    '<div class="plans" role="radiogroup" aria-label="Plan">'+
    '<button class="pc'+(D.plan==='yearly'?' on':'')+'" role="radio" aria-checked="'+(D.plan==='yearly')+'" data-plan="yearly"><span class="ribbon">First 3 months free</span><b>Yearly</b><span class="amt">₹5,391</span><span class="mut">One bill for 12 months. You pay for 9 and use 12, about ₹449 a month.</span></button>'+
    '<button class="pc'+(D.plan==='monthly'?' on':'')+'" role="radio" aria-checked="'+(D.plan==='monthly')+'" data-plan="monthly"><b>Monthly</b><span class="amt">₹599</span><span class="mut">Billed every month.</span></button></div>'+
    '<p class="mut" style="font-size:13px">Prices are final. No GST is added.'+(D.plan==='yearly'?' Yearly plan: full refund if you ask within 7 days of paying.':'')+' No payment is taken in this prototype.</p>'+nav(true,true,'Continue');
  }else{
    var slugB=slug(D.biz),l0=D.locs[0];var url='https://feedback.example.com/'+slugB+'/'+slug(l0.n);
    h='<h1>Your feedback page is ready</h1><p class="mut">Print the QR code or program it onto a TapReview stand. Both open the same page.</p>'+
    '<div class="qrbox"><canvas id="qr" width="200" height="200" role="img" aria-label="QR code for the feedback link"></canvas><div style="flex:1;min-width:200px;display:flex;flex-direction:column;gap:10px"><div class="url" id="url">'+esc(url)+'</div><div class="row"><button class="btn s" data-copy>Copy link</button><button class="btn s" data-dl>Save QR as image</button></div></div></div>'+
    '<div><b style="font-size:14px">Print size</b><div class="chips" style="margin-top:8px" role="group" aria-label="Print size">'+['Table card (A6)','Counter stand (A5)','Poster (A4)'].map(function(s,i){var k=['A6','A5','A4'][i];return '<button class="chip" data-size="'+k+'" aria-pressed="'+(D.size===k)+'">'+s+'</button>'}).join('')+'</div></div>'+
    '<dl class="sum"><dt>Business</dt><dd>'+esc(D.biz)+' · '+esc(D.cat)+'</dd><dt>Services</dt><dd>'+esc(D.svc.join(', '))+'</dd><dt>Locations</dt><dd>'+esc(D.locs.map(function(l){return l.n+(l.a?' ('+l.a+')':'')}).join(', '))+'</dd><dt>Google</dt><dd>'+(D.g?'Connected':'Not connected yet')+'</dd><dt>Plan</dt><dd>'+(D.plan==='yearly'?'Yearly · ₹5,391 (first 3 months free)':'Monthly · ₹599 a month')+'</dd></dl>'+
    '<div class="nav"><button class="btn s" data-back>Back</button><button class="btn p" data-finish>Open my dashboard</button></div>';
  }
  c.innerHTML=h;
  if(step===5)drawQR($('#qr'),$('#url').textContent);
  var f=c.querySelector('[aria-invalid="true"]')||c.querySelector('h1');if(f){f.setAttribute('tabindex','-1');f.focus({preventScroll:true})}
}
/* ---- minimal QR encoder (byte mode, ECC L, versions 1-6) ---- */
var QR=(function(){
  var EXP=[],LOG=[];(function(){var x=1;for(var i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=285}for(i=255;i<512;i++)EXP[i]=EXP[i-255]})();
  function mul(a,b){return a&&b?EXP[LOG[a]+LOG[b]]:0}
  function rs(data,n){var g=[1];for(var i=0;i<n;i++){var ng=new Array(g.length+1).fill(0);for(var j=0;j<g.length;j++){ng[j]^=g[j];ng[j+1]^=mul(g[j],EXP[i])}g=ng}
    var r=data.concat(new Array(n).fill(0));for(i=0;i<data.length;i++){var c=r[i];if(c)for(j=0;j<g.length;j++)r[i+j]^=mul(g[j],c)}return r.slice(data.length)}
  /* version: [total codewords, data codewords (L), ec per block, blocks] */
  var V={1:[26,19,7,1],2:[44,34,10,1],3:[70,55,15,1],4:[100,80,20,1],5:[134,108,26,1],6:[172,136,18,2],7:[196,156,20,2],8:[242,194,24,2],9:[292,232,30,2],10:[346,274,18,4]};
  var AL={2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],7:[6,22,38],8:[6,24,42],9:[6,26,46],10:[6,28,50]};
  function make(text){
    var bytes=Array.from(new TextEncoder().encode(text)),ver=0;
    for(var v=1;v<=10;v++){var cap=V[v][1]-(v<10?2:3);if(bytes.length<=cap){ver=v;break}}
    if(!ver)return null;
    var info=V[ver],bits=[];function put(val,len){for(var i=len-1;i>=0;i--)bits.push((val>>i)&1)}
    put(4,4);put(bytes.length,ver<10?8:16);bytes.forEach(function(b){put(b,8)});
    var cap8=info[1]*8;put(0,Math.min(4,cap8-bits.length));while(bits.length%8)bits.push(0);
    var cw=[];for(var i=0;i<bits.length;i+=8){var b=0;for(var j=0;j<8;j++)b=b<<1|bits[i+j];cw.push(b)}
    for(var p=0;cw.length<info[1];p++)cw.push(p%2?17:236);
    var nb=info[3],per=info[1]/nb|0,blocks=[],ecs=[],pos=0,extra=info[1]-per*nb;
    for(i=0;i<nb;i++){var len=per+(i>=nb-extra?1:0),blk=cw.slice(pos,pos+len);pos+=len;blocks.push(blk);ecs.push(rs(blk,info[2]))}
    var out=[],ml=Math.max.apply(null,blocks.map(function(b){return b.length}));
    for(i=0;i<ml;i++)blocks.forEach(function(b){if(i<b.length)out.push(b[i])});
    for(i=0;i<info[2];i++)ecs.forEach(function(e){out.push(e[i])});
    var n=17+4*ver,M=[],F=[];for(i=0;i<n;i++){M.push(new Array(n).fill(null));F.push(new Array(n).fill(false))}
    function set(r,c,v){M[r][c]=v;F[r][c]=true}
    function finder(r,c){for(var y=-1;y<=7;y++)for(var x=-1;x<=7;x++){var rr=r+y,cc=c+x;if(rr<0||cc<0||rr>=n||cc>=n)continue;set(rr,cc,(y>=0&&y<=6&&(x===0||x===6)||x>=0&&x<=6&&(y===0||y===6)||y>=2&&y<=4&&x>=2&&x<=4))}}
    finder(0,0);finder(0,n-7);finder(n-7,0);
    for(i=8;i<n-8;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
    if(AL[ver]){var a=AL[ver];a.forEach(function(r){a.forEach(function(c){if(F[r][c])return;for(var y=-2;y<=2;y++)for(var x=-2;x<=2;x++)set(r+y,c+x,Math.max(Math.abs(x),Math.abs(y))!==1)})})}
    set(n-8,8,true);
    for(i=0;i<9;i++){if(!F[8][i])set(8,i,false);if(!F[i][8])set(i,8,false)}
    for(i=0;i<8;i++){if(!F[8][n-1-i])set(8,n-1-i,false);if(!F[n-1-i][8])set(n-1-i,8,false)}
    var data=[];out.forEach(function(b){for(var k=7;k>=0;k--)data.push((b>>k)&1)});
    var best=null,bs=1e9;
    for(var mask=0;mask<8;mask++){
      var T=M.map(function(r){return r.slice()}),di=0,up=true;
      for(var col=n-1;col>0;col-=2){if(col===6)col--;for(var k=0;k<n;k++){var r=up?n-1-k:k;for(var cc=0;cc<2;cc++){var c=col-cc;if(F[r][c])continue;var bit=di<data.length?data[di++]:0;var m=[(r+c)%2===0,r%2===0,c%3===0,(r+c)%3===0,(((r/2|0)+(c/3|0))%2)===0,((r*c)%2+(r*c)%3)===0,(((r*c)%2+(r*c)%3)%2)===0,(((r+c)%2+(r*c)%3)%2)===0][mask];T[r][c]=m?!bit:!!bit;if(T[r][c]===!1&&false){}}}up=!up}
      /* format info, ECC L = 01 */
      var fd=(1<<3|mask),rem=fd<<10;for(k=14;k>=10;k--)if((rem>>k)&1)rem^=0x537<<(k-10);var fmt=((fd<<10)|rem)^0x5412;
      for(k=0;k<15;k++){var bt=((fmt>>k)&1)===1;
        if(k<6)T[k][8]=bt;else if(k<8)T[k+1][8]=bt;else T[n-15+k][8]=bt;
        if(k<8)T[8][n-1-k]=bt;else if(k<9)T[8][15-k]=bt;else T[8][14-k]=bt}
      T[n-8][8]=true;
      var sc=0;for(r=0;r<n;r++){var run=1;for(c=1;c<n;c++){if(T[r][c]===T[r][c-1]){run++;if(run===5)sc+=3;else if(run>5)sc++}else run=1}}
      for(c=0;c<n;c++){run=1;for(r=1;r<n;r++){if(T[r][c]===T[r-1][c]){run++;if(run===5)sc+=3;else if(run>5)sc++}else run=1}}
      if(sc<bs){bs=sc;best=T}
    }
    return best;
  }
  return {make:make};
})();
function drawQR(cv,text){
  var m=QR.make(text),ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,200,200);
  if(!m){ctx.fillStyle='#000';ctx.fillText('Link too long',20,100);return}
  var n=m.length,q=4,s=Math.floor(200/(n+q*2)),off=Math.floor((200-s*n)/2);ctx.fillStyle='#000';
  for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(m[r][c])ctx.fillRect(off+c*s,off+r*s,s,s);
}
/* ---- events ---- */
function validate(){
  errs={};
  if(step===0){
    if(!D.biz.trim())errs.biz='Enter your business name.';
    if(!D.owner.trim())errs.owner='Enter your name.';
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(D.email.trim()))errs.email='Enter a valid email, like name@business.com.';
  }
  if(step===1&&!D.svc.length)errs.svc='Pick or add at least one service.';
  if(step===2)D.locs.forEach(function(l,i){if(!l.n.trim())errs['ln'+i]='Give this location a name.'});
  return !Object.keys(errs).length;
}
document.addEventListener('input',function(e){
  var t=e.target,id=t.id;
  if(id==='biz')D.biz=t.value;else if(id==='owner')D.owner=t.value;else if(id==='email')D.email=t.value;else if(id==='pid')D.placeId=t.value;
  else if(t.dataset.ln!==undefined)D.locs[+t.dataset.ln].n=t.value;else if(t.dataset.la!==undefined)D.locs[+t.dataset.la].a=t.value;
});
document.addEventListener('change',function(e){
  if(e.target.id==='cat'){D.cat=e.target.value;D.svc=SUGG[D.cat].slice(0,3)}
  if(e.target.dataset.cs!==undefined){var i=D.svc.indexOf(e.target.dataset.cs);var v=e.target.value.trim();if(i>-1){if(v)D.svc[i]=v;else D.svc.splice(i,1)}render()}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='newsvc'){e.preventDefault();addSvc()}});
function addSvc(){var i=$('#newsvc'),v=i.value.trim();if(!v)return;if(D.svc.indexOf(v)<0)D.svc.push(v);errs={};render();$('#newsvc').focus()}
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;var d=b.dataset;
  if(d.next!==undefined){if(!validate()){render();return}step++;render();window.scrollTo(0,0);return}
  if(d.back!==undefined){step--;errs={};render();window.scrollTo(0,0);return}
  if(d.svc){var i=D.svc.indexOf(d.svc);if(i>-1)D.svc.splice(i,1);else D.svc.push(d.svc);render();return}
  if(d.rm){D.svc.splice(D.svc.indexOf(d.rm),1);render();return}
  if(d.addsvc!==undefined){addSvc();return}
  if(d.addloc!==undefined){D.locs.push({n:'',a:''});render();return}
  if(d.rml!==undefined){D.locs.splice(+d.rml,1);render();return}
  if(d.g!==undefined){D.g=!D.g;toast(D.g?'Example connection. Real Google sign-in needs your backend.':'Disconnected');render();return}
  if(d.size){D.size=d.size;render();return}
  if(d.plan){D.plan=d.plan;render();return}
  if(d.copy!==undefined){var u=$('#url').textContent;(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(u):Promise.reject()).then(function(){toast('Link copied')},function(){var r=document.createRange();r.selectNodeContents($('#url'));var s=getSelection();s.removeAllRanges();s.addRange(r);toast('Link selected. Copy it manually.')});return}
  if(d.dl!==undefined){toast('Image download works in the full build. For now, take a screenshot of the QR code.');return}
  if(d.finish!==undefined){toast('This opens your dashboard in the full build.');return}
});
render();
})();
